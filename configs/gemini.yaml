# Kapsis Configuration - Gemini CLI Agent (Google)
# Use with: ./scripts/launch-agent.sh ~/project --agent gemini
#           ./scripts/launch-agent.sh ~/project --config configs/gemini.yaml
#
# Build the image first: ./scripts/build-agent-image.sh gemini-cli --profile full-stack

# Provider image built by build-agent-image.sh from configs/agents/gemini-cli.yaml
image:
  name: kapsis-gemini-cli
  tag: latest

agent:
  # Explicit type drives status-hook injection / agent-type detection.
  type: gemini-cli
  # Non-interactive Gemini run.
  #  - `-p`               : headless (non-interactive) mode with the given prompt.
  #  - `--approval-mode yolo` : auto-approve all tool calls (unattended run).
  #  - `--skip-trust`     : REQUIRED headless — /workspace is an untrusted folder;
  #                         without it gemini refuses to act and downgrades to prompt mode.
  # KAPSIS_INJECTED_TASK_SPEC is set by entrypoint.sh when status injection appends
  # progress/gist guidance to a writable copy of the spec; falls back to /task-spec.md.
  command: "gemini --approval-mode yolo --skip-trust -p \"$(cat \"${KAPSIS_INJECTED_TASK_SPEC:-/task-spec.md}\")\""
  workdir: /workspace

filesystem:
  # OAuth/subscription auth: inject ONLY the minimal Gemini session files, as
  # writable copies (stage-and-copy path), so gemini can refresh its access token
  # mid-run. Do NOT include the whole ~/.gemini — it holds history, projects, and
  # other state that must not enter the sandbox.
  include:
    - ~/.gemini/oauth_creds.json       # Google-login OAuth session
    - ~/.gemini/google_accounts.json   # active account selection
    - ~/.gemini/google_account_id      # active account id
    - ~/.gemini/settings.json          # model/settings (no secrets required)
    - ~/.gitconfig
    - ~/.ssh
    - ~/.zshrc

environment:
  # If you use API-key auth instead of the OAuth session files, export GEMINI_API_KEY
  # on the host and it will pass through. OAuth-file injection above needs no env.
  passthrough:
    - GEMINI_API_KEY
  set:
    MAVEN_OPTS: "-Xmx4g -XX:+UseG1GC"

resources:
  memory: 8g
  cpus: 4

# Network isolation. Gemini with a personal Google login uses the Code Assist
# backend (cloudcode-pa.googleapis.com) plus Google OAuth token refresh
# (oauth2.googleapis.com / accounts.google.com); with an API key it uses
# generativelanguage.googleapis.com. All are allowlisted so `--agent gemini`
# works in the default filtered mode out of the box. See
# configs/network-allowlist.yaml for the full reference.
network:
  mode: filtered
  allowlist:
    ai:
      - cloudcode-pa.googleapis.com      # Gemini Code Assist (personal login)
      - generativelanguage.googleapis.com # Gemini API (API-key auth)
      - aiplatform.googleapis.com
      - gemini.google.com
    custom:
      - oauth2.googleapis.com            # Google OAuth token refresh
      - accounts.google.com
      - www.googleapis.com
    hosts:
      - github.com
      - "*.github.com"
      - gitlab.com
      - "*.gitlab.com"
      - bitbucket.org
      - "*.bitbucket.org"
    registries:
      - registry.npmjs.org
      - "*.npmjs.org"

#===============================================================================
# SECURITY - Container security hardening
#===============================================================================
security:
  profile: standard
  capabilities:
    add:
      # Required for network.mode: filtered (dnsmasq binds to port 53)
      - NET_BIND_SERVICE

maven:
  mirror_url: "https://artifactory.example.org/artifactory/releases"
  block_remote_snapshots: true
  block_deploy: true

git:
  auto_push:
    enabled: true
    remote: origin
    commit_message: |
      feat: {task}

      Generated by Gemini CLI via Kapsis
      Branch: {branch}

  co_authors:
    - "Aviad Shiber <aviadshiber@gmail.com>"

  commit_exclude:
    - ".gitignore"
    - "**/.gitignore"

  fork_workflow:
    enabled: false
    fallback: fork
