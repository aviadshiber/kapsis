# Kapsis Configuration - Codex CLI Agent (OpenAI)
# Use with: ./scripts/launch-agent.sh ~/project --agent codex
#           ./scripts/launch-agent.sh ~/project --config configs/codex.yaml
#
# Build the image first: ./scripts/build-agent-image.sh codex-cli --profile full-stack

# Provider image built by build-agent-image.sh from configs/agents/codex-cli.yaml
image:
  name: kapsis-codex-cli
  tag: latest

agent:
  # Explicit type drives status-hook injection / agent-type detection.
  type: codex-cli
  # Non-interactive Codex run.
  #  - `codex exec`        : headless entrypoint (replaces the old `--approval-mode full-auto`)
  #  - `--dangerously-bypass-approvals-and-sandbox`
  #                        : REQUIRED in-container — the kapsis container IS the sandbox,
  #                          so Codex's own landlock/seccomp sandbox must not try to nest.
  #  - `--ignore-user-config` : do NOT load ~/.codex/config.toml inside the sandbox.
  #                          config.toml can hold [mcp_servers] with `env` secrets and
  #                          hook COMMANDS; injecting it would smuggle unrelated secrets
  #                          / execution primitives into a prompt-injectable sandbox.
  #                          Auth is unaffected — it still reads CODEX_HOME/auth.json.
  #  - `--skip-git-repo-check` : allow running when /workspace isn't a git repo yet.
  # KAPSIS_INJECTED_TASK_SPEC is set by entrypoint.sh when status injection appends
  # progress/gist guidance to a writable copy of the spec; falls back to /task-spec.md.
  command: "codex exec --dangerously-bypass-approvals-and-sandbox --ignore-user-config --skip-git-repo-check \"$(cat \"${KAPSIS_INJECTED_TASK_SPEC:-/task-spec.md}\")\""
  workdir: /workspace

filesystem:
  # OAuth/subscription auth: inject ONLY the Codex OAuth session file, as a writable
  # copy (stage-and-copy path), so codex can refresh its access token mid-run. Do NOT
  # include config.toml (see --ignore-user-config above) or the whole ~/.codex (it
  # holds history, sqlite, and other agents' state that must not enter the sandbox).
  include:
    - ~/.codex/auth.json     # ChatGPT-login OAuth session (or API-key record)
    - ~/.gitconfig
    - ~/.ssh
    - ~/.zshrc

environment:
  # If you use API-key auth instead of the OAuth session file, export CODEX_API_KEY
  # (the official automation env var; OPENAI_API_KEY is a legacy fallback) on the host
  # and it will pass through. OAuth-file injection above needs no env.
  passthrough:
    - CODEX_API_KEY
    - OPENAI_API_KEY
  set:
    MAVEN_OPTS: "-Xmx4g -XX:+UseG1GC"

resources:
  memory: 8g
  cpus: 4

# Network isolation. Codex needs to reach the OpenAI/ChatGPT backend; with the
# ChatGPT-subscription OAuth session it talks to chatgpt.com/backend-api (NOT just
# api.openai.com), so both are allowlisted. Unlike the base example configs, this
# ships a self-contained allowlist so `--agent codex` works in the default filtered
# mode out of the box. See configs/network-allowlist.yaml for the full reference.
network:
  mode: filtered
  allowlist:
    ai:
      - api.openai.com
      - "*.openai.com"
      - chatgpt.com          # ChatGPT-subscription (codex login) backend
      - "*.chatgpt.com"
    hosts:
      - github.com
      - "*.github.com"
      - gitlab.com
      - "*.gitlab.com"
      - bitbucket.org
      - "*.bitbucket.org"
    registries:
      - registry.npmjs.org
      - "*.npmjs.org"

#===============================================================================
# SECURITY - Container security hardening
#===============================================================================
security:
  profile: standard
  capabilities:
    add:
      # Required for network.mode: filtered (dnsmasq binds to port 53)
      - NET_BIND_SERVICE

maven:
  mirror_url: "https://artifactory.example.org/artifactory/releases"
  block_remote_snapshots: true
  block_deploy: true

git:
  auto_push:
    enabled: true
    remote: origin
    commit_message: |
      feat: {task}

      Generated by Codex CLI via Kapsis
      Branch: {branch}

  co_authors:
    - "Aviad Shiber <aviadshiber@gmail.com>"

  commit_exclude:
    - ".gitignore"
    - "**/.gitignore"

  fork_workflow:
    enabled: false
    fallback: fork
