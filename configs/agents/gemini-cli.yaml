# Google Gemini CLI Agent Profile (BUILD-TIME ONLY)
# Official Google CLI for Gemini code generation.
#
# Build: ./scripts/build-agent-image.sh gemini-cli --profile full-stack
# Result: kapsis-gemini-cli:latest
#
# build-agent-image.sh consumes ONLY .name / .install / .dependencies / .description
# from this file. The RUNTIME command, auth, network, and hook wiring live in the
# authoritative launch config → configs/gemini.yaml. Do not duplicate those here;
# copies drift. Gemini is Node.js-based (no native binary).
# https://github.com/google-gemini/gemini-cli
#
# Auth note: Gemini "Login with Google" for personal free/Pro/Ultra tiers was
# deprecated by Google on 2026-06-18 — only org-backed Code Assist Standard/Enterprise
# OAuth or a GEMINI_API_KEY still work headless. See configs/gemini.yaml.

name: gemini-cli
description: Google Gemini CLI (requires Node.js)

install:
  # Pinned for reproducible images. Bump deliberately, then re-verify `gemini --help`
  # inside the built image and re-run the smoke test.
  npm: "@google/gemini-cli@0.57.0"

dependencies:
  - nodejs >= 18  # Required - no native binary available
  - git

# Runtime command — AUTHORITATIVE copy lives in configs/gemini.yaml. Mirrored here only
# to satisfy the agent-profile convention (build does not read it). Keep in sync.
command: "gemini --approval-mode yolo --skip-trust -p"
