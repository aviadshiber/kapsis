# OpenAI Codex CLI Agent Profile (BUILD-TIME ONLY)
# Official OpenAI CLI for code generation.
#
# Build: ./scripts/build-agent-image.sh codex-cli --profile full-stack
# Result: kapsis-codex-cli:latest
#
# build-agent-image.sh consumes ONLY .name / .install / .dependencies / .description
# from this file. The RUNTIME command, auth, network, and hook wiring live in the
# authoritative launch config → configs/codex.yaml. Do not duplicate those here;
# copies drift. Codex is Node.js-based (no native binary). https://github.com/openai/codex

name: codex-cli
description: OpenAI Codex CLI (requires Node.js)

install:
  # Pinned for reproducible images. Bump deliberately, then re-verify
  # `codex exec --help` inside the built image and re-run the smoke test.
  npm: "@openai/codex@0.151.0"

dependencies:
  - nodejs >= 18  # Required - no native binary available
  - git

# Runtime command — AUTHORITATIVE copy lives in configs/codex.yaml. Mirrored here only
# to satisfy the agent-profile convention (build does not read it). Keep in sync.
command: "codex exec --dangerously-bypass-approvals-and-sandbox --ignore-user-config --skip-git-repo-check"
